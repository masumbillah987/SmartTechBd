<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout</title>

<style>

body{
    font-family:Arial;
    background:#0b1120;
    color:white;
    padding:20px;
}

.container{
    max-width:500px;
    margin:auto;
    background:#111827;
    padding:20px;
    border-radius:15px;
}

h2{
    color:#00e5ff;
}

input, select{
    width:100%;
    padding:12px;
    margin:10px 0;
    border-radius:10px;
    border:none;
    background:#1e293b;
    color:white;
}

button{
    width:100%;
    padding:14px;
    background:#25D366;
    border:none;
    border-radius:12px;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.info{
    margin-bottom:15px;
    padding:10px;
    background:#0f172a;
    border-radius:10px;
    color:#00e5ff;
}

</style>

</head>

<body>

<div class="container">

<h2>Checkout</h2>

<div class="info" id="productInfo"></div>

<input type="text" id="name" placeholder="Your Name">
<input type="tel" id="phone" placeholder="Phone Number">
<input type="text" id="address" placeholder="Full Address">

<select id="courier">
    <option>Sundarban Courier</option>
    <option>SA Paribahan</option>
</select>

<button onclick="confirmOrder()">Confirm Order</button>

</div>

<script>

let product = localStorage.getItem("product");
let quantity = localStorage.getItem("quantity");

document.getElementById("productInfo").innerText =
"Product: " + product + " | Quantity: " + quantity;

function confirmOrder(){

    let name = document.getElementById("name").value;
    let phone = document.getElementById("phone").value;
    let address = document.getElementById("address").value;
    let courier = document.getElementById("courier").value;

    if(!name || !phone || !address){
        alert("Please fill all fields!");
        return;
    }

    let message =
`🛒 NEW ORDER

📦 Product: ${product}
🔢 Quantity: ${quantity}

👤 Name: ${name}
📞 Phone: ${phone}
📍 Address: ${address}

🚚 Courier: ${courier}
`;

    let url = "https://wa.me/8801720262742?text=" + encodeURIComponent(message);

    window.open(url, "_blank");
}

</script>

</body>
</html>
